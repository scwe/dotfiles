#remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
# Set back tick to backtick
# set -g prefix `
# bind-key ` send-prefix

# Set vim movements in tmux scrolling (C+u, C+f, C+b, C+d)
set-window-option -g mode-keys vi


# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Move panes with same keys as vim
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

#Stop the confirmation on kill-pane
bind x kill-pane
bind & kill-window

#start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

#Allow 256 color supprt in tmux
set -g default-terminal "xterm"

# Claude Code: notifications + Shift+Enter
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Forward the active pane's OSC-set title to the outer terminal so Ghostty's
# tab shows whatever the inner program (Claude Code, etc.) is reporting,
# instead of just "tmux".
set -g set-titles on
set -g set-titles-string "#T"

# Forward focus-in/focus-out events to inner panes so Claude Code can tell
# when I've switched away from the terminal (its 'active in terminal'
# notification suppression hinges on this).
set -g focus-events on
